<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E88E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64B5F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#gradient)" />
  
  <!-- Cricket Bat -->
  <path d="M80,160 L100,120 L130,80 L125,75 L95,115 L75,155 Z" fill="#D7CCC8" />
  <path d="M125,75 L130,80 L135,75 L145,65 L140,60 L130,70 Z" fill="#A1887F" />
  
  <!-- Cricket Ball -->
  <circle cx="65" cy="165" r="20" fill="#F44336" />
  <path d="M55,155 Q65,152 75,155 Q78,165 75,175 Q65,178 55,175 Q52,165 55,155" fill="none" stroke="#FFFFFF" stroke-width="2" />
  
  <!-- Box/Stadium Outline -->
  <rect x="30" y="30" width="140" height="140" rx="10" ry="10" fill="none" stroke="white" stroke-width="6" />
  
  <!-- Text -->
  <text x="100" y="40" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">BOX CRICKET HUB</text>
</svg>
